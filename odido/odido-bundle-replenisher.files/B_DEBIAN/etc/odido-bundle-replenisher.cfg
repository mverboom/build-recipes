# Odido Bundle Replenisher configuration
# See https://github.com/lodu/odido-bundle-replenisher

# Your phone number (required)
MSISDN=+3161234567890

# Authorization token. Obtain it by running `odido-bundle-replenisher`
# interactively once (it prints a login URL and asks for the redirect URL).
AUTHORIZATION_TOKEN=xxxxxxxxxx

# Check interval in minutes (default 5)
CHECK_INTERVAL=5

# Request a new bundle when remaining MBs drop below this (default 2000)
MB_THRESHOLD=2000
