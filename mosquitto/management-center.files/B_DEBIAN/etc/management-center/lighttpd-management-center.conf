# lighttpd management-center example config (reverse proxy with https)
#
# A self-signed certificate is generated in /etc/management-center on first
# install; replace it with a real one (e.g. from Let's Encrypt) in production.
# The private key must be readable by the user lighttpd runs as.
#
# apt install lighttpd
# cp /etc/management-center/lighttpd-management-center.conf /etc/lighttpd/conf-available/99-management-center.conf
# lighttpd-enable-mod management-center
# systemctl restart lighttpd
#
server.modules += (
   "mod_openssl",
   "mod_proxy" )

$HTTP["scheme"] == "http" {
    url.redirect = ("" => "https://${url.authority}${url.path}${qsa}")
    url.redirect-code = 308
}

$SERVER["socket"] == ":443" {
        ssl.engine = "enable"
        ssl.privkey = "/etc/management-center/privkey.pem"
        ssl.pemfile = "/etc/management-center/fullchain.pem"
}

$HTTP["url"] =~ "(^/)" {
  proxy.server  = ( "" => ("" => ( "host" => "127.0.0.1", "port" => 8088 )))
  proxy.header = ( "upgrade" => "enable" )
}
